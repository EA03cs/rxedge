name: rxedge
description: "RxEdge - Premium learning and resource platform for Medical Representatives"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.2
  path_provider: any
  lucide_icons: ^0.257.0
  google_fonts: ^8.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
